services:
  - type: web
    name: medicare-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: MEDICARE_ADMIN_EMAIL
        sync: false
      - key: MEDICARE_ADMIN_PASSWORD
        sync: false
      - key: MEDICARE_ADMIN_SECRET
        generateValue: true
